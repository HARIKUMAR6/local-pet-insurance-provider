<header class="site-header sticky top-0 z-40 border-b border-line/10 bg-bg">
  <!-- Three-column grid (1fr auto 1fr) keeps the primary nav centred on the header itself, not in the leftover space. -->
  <div class="site-header__bar container-site grid h-header grid-cols-[1fr_auto] items-center gap-4 xl:grid-cols-[1fr_auto_1fr] xl:gap-5">
    <a class="logo justify-self-start" href="index.html" aria-label="Pawstead, go to Home 1" dir="ltr">
      <svg class="logo__mark" viewBox="0 0 32 36" aria-hidden="true" focusable="false"><path class="logo__shield" d="M16 1.25 29.5 5.9v10.6c0 8.6-5.5 15.1-13.5 18.25C8 31.6 2.5 25.1 2.5 16.5V5.9Z"/><g class="logo__paw"><ellipse cx="9.9" cy="15.6" rx="2" ry="2.55" transform="rotate(-24 9.9 15.6)"/><ellipse cx="13.7" cy="11.5" rx="2.05" ry="2.7" transform="rotate(-8 13.7 11.5)"/><ellipse cx="18.3" cy="11.5" rx="2.05" ry="2.7" transform="rotate(8 18.3 11.5)"/><ellipse cx="22.1" cy="15.6" rx="2" ry="2.55" transform="rotate(24 22.1 15.6)"/><path d="M16 17.6c-3 0-6.3 3.5-6.3 6.5 0 2 1.5 3.2 3.3 3.2 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.8 0 3.3-1.2 3.3-3.2 0-3-3.3-6.5-6.3-6.5Z"/></g></svg>
      <span class="logo__word">Pawstead</span>
    </a>

    <nav class="site-nav hidden xl:block" aria-label="Primary">
      <ul class="flex items-center" role="list">
        <li class="relative" data-dropdown>
          <button type="button" class="nav-link" aria-expanded="false" aria-controls="nav-home-menu" data-dropdown-toggle data-nav-group="home">
            Home
            <svg class="nav-link__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg>
          </button>
          <ul id="nav-home-menu" class="dropdown" role="list" data-dropdown-panel hidden>
            <li><a class="dropdown__link" href="index.html" data-nav="home-1">Home 1</a></li>
            <li><a class="dropdown__link" href="home-2.html" data-nav="home-2">Home 2</a></li>
          </ul>
        </li>
        <li><a class="nav-link" href="about.html" data-nav="about">About</a></li>
        <li><a class="nav-link" href="plans.html" data-nav="plans">Plans</a></li>
        <li><a class="nav-link" href="claims.html" data-nav="claims">Claims</a></li>
        <li><a class="nav-link" href="contact.html" data-nav="contact">Contact</a></li>
        <li><a class="nav-link" href="dashboard.html" data-nav="dashboard">Dashboard</a></li>
        <li><a class="nav-link" href="login.html" data-nav="login">Login</a></li>
      </ul>
    </nav>

    <div class="flex items-center gap-3 justify-self-end xl:gap-2">
      <div class="hidden items-center gap-2 xl:flex">
        <div class="dir-switch" role="group" aria-label="Text direction">
          <button type="button" class="dir-switch__btn" data-dir-option="ltr" aria-pressed="true">LTR</button>
          <button type="button" class="dir-switch__btn" data-dir-option="rtl" aria-pressed="false">RTL</button>
        </div>
        <button type="button" class="icon-btn" data-theme-toggle aria-label="Switch to dark theme">
          <svg class="theme-icon--to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
          <svg class="theme-icon--to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
        </button>
      </div>
      <!-- Desktop only: below xl the drawer carries the same CTA in its footer. -->
      <a class="btn btn-primary hidden xl:inline-flex" href="plans.html">Explore Plans</a>
      <button type="button" class="icon-btn xl:hidden" aria-label="Open menu" aria-expanded="false" aria-controls="site-drawer" data-drawer-open>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="M3 5.5h14M3 10h14M3 14.5h14"/></svg>
      </button>
    </div>
  </div>

  <div class="drawer-backdrop" data-drawer-backdrop hidden></div>

  <div id="site-drawer" class="drawer" role="dialog" aria-modal="true" aria-label="Site menu" data-drawer hidden>
    <div class="drawer__head">
      <a class="logo" href="index.html" aria-label="Pawstead, go to Home 1" dir="ltr">
        <svg class="logo__mark" viewBox="0 0 32 36" aria-hidden="true" focusable="false"><path class="logo__shield" d="M16 1.25 29.5 5.9v10.6c0 8.6-5.5 15.1-13.5 18.25C8 31.6 2.5 25.1 2.5 16.5V5.9Z"/><g class="logo__paw"><ellipse cx="9.9" cy="15.6" rx="2" ry="2.55" transform="rotate(-24 9.9 15.6)"/><ellipse cx="13.7" cy="11.5" rx="2.05" ry="2.7" transform="rotate(-8 13.7 11.5)"/><ellipse cx="18.3" cy="11.5" rx="2.05" ry="2.7" transform="rotate(8 18.3 11.5)"/><ellipse cx="22.1" cy="15.6" rx="2" ry="2.55" transform="rotate(24 22.1 15.6)"/><path d="M16 17.6c-3 0-6.3 3.5-6.3 6.5 0 2 1.5 3.2 3.3 3.2 1.2 0 2-.6 3-.6s1.8.6 3 .6c1.8 0 3.3-1.2 3.3-3.2 0-3-3.3-6.5-6.3-6.5Z"/></g></svg>
        <span class="logo__word">Pawstead</span>
      </a>
      <button type="button" class="icon-btn" aria-label="Close menu" data-drawer-close>
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><path d="m5 5 10 10M15 5 5 15"/></svg>
      </button>
    </div>

    <nav class="drawer__nav" aria-label="Mobile">
      <ul role="list">
        <li class="drawer__item">
          <button type="button" class="drawer__link" aria-expanded="false" aria-controls="drawer-home-menu" data-disclosure-toggle data-nav-group="home">
            Home
            <svg class="nav-link__chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m4 6 4 4 4-4"/></svg>
          </button>
          <ul id="drawer-home-menu" class="drawer__sub" role="list" hidden>
            <li><a class="drawer__sublink" href="index.html" data-nav="home-1">Home 1</a></li>
            <li><a class="drawer__sublink" href="home-2.html" data-nav="home-2">Home 2</a></li>
          </ul>
        </li>
        <li class="drawer__item"><a class="drawer__link" href="about.html" data-nav="about">About</a></li>
        <li class="drawer__item"><a class="drawer__link" href="plans.html" data-nav="plans">Plans</a></li>
        <li class="drawer__item"><a class="drawer__link" href="claims.html" data-nav="claims">Claims</a></li>
        <li class="drawer__item"><a class="drawer__link" href="contact.html" data-nav="contact">Contact</a></li>
        <li class="drawer__item"><a class="drawer__link" href="dashboard.html" data-nav="dashboard">Dashboard</a></li>
        <li class="drawer__item"><a class="drawer__link" href="login.html" data-nav="login">Login</a></li>
      </ul>
    </nav>

    <div class="drawer__controls">
      <div class="dir-switch dir-switch--block" role="group" aria-label="Text direction">
        <button type="button" class="dir-switch__btn" data-dir-option="ltr" aria-pressed="true">LTR</button>
        <button type="button" class="dir-switch__btn" data-dir-option="rtl" aria-pressed="false">RTL</button>
      </div>
      <button type="button" class="icon-btn icon-btn--block" data-theme-toggle aria-label="Switch to dark theme">
        <svg class="theme-icon--to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7Z"/></svg>
        <svg class="theme-icon--to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="drawer__foot">
      <a class="btn btn-primary btn-block" href="plans.html">Explore Plans</a>
    </div>
  </div>
</header>
