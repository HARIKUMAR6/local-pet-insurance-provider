<meta name="theme-color" content="#183C35">
<script>
  /* Apply saved theme/direction before first paint (no flash). Falls back to the OS colour scheme. */
  (function () {
    var root = document.documentElement, theme, dir;
    try { theme = localStorage.getItem('pawstead-theme'); dir = localStorage.getItem('pawstead-dir'); } catch (e) {}
    if (theme !== 'light' && theme !== 'dark') {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    root.setAttribute('data-theme', theme);
    root.setAttribute('dir', dir === 'rtl' ? 'rtl' : 'ltr');
  })();
</script>
